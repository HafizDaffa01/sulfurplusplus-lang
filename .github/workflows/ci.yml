name: Sulfur++ CI / CD & Release Engine

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev ninja-build

      - name: Setup Ninja & CMake
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.0

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_LLVM=OFF

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Add build directory to PATH (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          echo "$PWD/build" >> $GITHUB_PATH

      - name: Add build directory to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "$PWD/build" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Code Linter (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/sfpm lint

      - name: Run Code Linter (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\sfpm.exe lint

      - name: Run Full Test Suite (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./run_tests.sh || true
          if [ -f "./run_tests.sh" ]; then
            ./run_tests.sh
          else
            ./build/sfpm test
          fi

      - name: Run Full Test Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "run_tests.cmd") {
            .\run_tests.cmd
          } else {
            .\build\sfpm.exe test
          }

      - name: Verify Standalone AOT Compilation (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/combust --compile tests/01_arithmetic.sfpp -o build/test_aot_01
          ./build/test_aot_01

      - name: Verify Standalone AOT Compilation (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\combust.exe --compile tests\01_arithmetic.sfpp -o build\test_aot_01.exe
          .\build\test_aot_01.exe

      - name: Run Performance Benchmarks (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/sfpm bench

      - name: Run Performance Benchmarks (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\sfpm.exe bench

      - name: Upload Release Binaries
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/combust
            ./build/sfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
